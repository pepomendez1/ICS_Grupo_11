<style>
  .tickets { display: grid; gap: 18px; }
  .ticket {
    display: grid; grid-template-columns: 1fr 200px; position: relative;
    background: var(--papel); border: 1px solid var(--borde); border-radius: 14px;
    box-shadow: 0 1px 0 rgba(0,0,0,.03); break-inside: avoid; page-break-inside: avoid;
    overflow: hidden; /* las muescas quedan como un mordisco del troquel */
  }
  .ticket-cuerpo { padding: 20px 24px; border-left: 6px solid var(--musgo); border-radius: 14px 0 0 14px; }
  .ticket-marca { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .ticket-marca img { width: 30px; height: 30px; flex: none; display: block; }
  .ticket-marca strong { font-weight: 900; color: var(--bosque); font-size: 1.15rem; line-height: 1.1; }
  .ticket-marca small { display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
  .ticket dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 0 0 14px; font-size: .95rem; }
  .ticket dt { color: var(--suave); }
  .ticket dd { margin: 0; font-weight: 600; }
  .estado { display: inline-block; font-size: .8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .estado-efectivo { background: var(--crema); color: var(--texto); }
  .estado-pagada, .estado-sin_cargo { background: var(--salvia); color: var(--bosque); }
  .estado-pendiente { background: var(--crema); color: var(--suave); }
  .estado-rechazada, .estado-cancelada, .estado-vencida { background: var(--papel); color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
  .ticket-talon {
    position: relative; padding: 18px; border-left: 2px dashed var(--borde);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px;
  }
  /* Muescas del troquel entre el ticket y el talón */
  .ticket-talon::before, .ticket-talon::after {
    content: ""; position: absolute; left: -12px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--crema); border: 1px solid var(--borde);
  }
  .ticket-talon::before { top: -12px; }
  .ticket-talon::after { bottom: -12px; }
  .ticket-talon .qr { width: 150px; height: 150px; display: block; }
  .ticket-talon code { font-size: .72rem; color: var(--suave); letter-spacing: .04em; }
  .ticket-talon .espera { color: var(--suave); font-size: .9rem; font-weight: 600; max-width: 150px; }
  .ticket-talon .espera svg { width: 34px; height: 34px; display: block; margin: 0 auto 6px; }
  @media (max-width: 560px) {
    .ticket { grid-template-columns: 1fr; }
    .ticket-cuerpo { border-radius: 14px 14px 0 0; padding: 18px 18px 16px; }
    .ticket-talon { border-left: 0; border-top: 2px dashed var(--borde); padding: 20px 18px 22px; }
    .ticket-talon::before { top: -12px; left: -12px; }
    .ticket-talon::after { top: -12px; bottom: auto; left: auto; right: -12px; }
    .ticket-talon .qr { width: 180px; height: 180px; }
  }
  @media print {
    .ticket { border: 1px solid #000; box-shadow: none; margin-bottom: 12px; }
    .ticket, .ticket * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .ticket-talon { border-left-color: #000; }
    .ticket-talon::before, .ticket-talon::after { background: #fff; border-color: #000; }
  }
</style>
