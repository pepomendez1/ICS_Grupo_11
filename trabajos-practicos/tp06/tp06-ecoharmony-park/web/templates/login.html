{% extends "base.html" %}
{% block titulo %}Ingresar · EcoHarmony Park{% endblock %}
{% block contenido %}
<div class="angosta">
  <h1>Ingresar</h1>
  <p class="bajada">La compra de entradas es solo para usuarios registrados.</p>
  <form class="tarjeta" method="post">
    <div class="campo">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required autofocus>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required>
    </div>
    <button class="boton ancho" type="submit">Ingresar</button>
    <p class="ayuda" style="margin-bottom:0">¿No tenés cuenta? <a href="{{ url_for('registro') }}">Creá una</a>.</p>
  </form>
</div>
{% endblock %}
